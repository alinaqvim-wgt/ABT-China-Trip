<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
<title>China Factory Trip · ABT</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css"/>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet"/>
<style>
:root{
  --ink:#122029; --ink2:#1c2f3a; --paper:#f3efe6; --card:#ffffff;
  --line:#e2ddd0; --muted:#68727b; --text:#1a2830;
  --cinnabar:#c8442e; --jade:#2f7d5b; --amber:#bf8613; --slate:#5b7a8c; --violet:#6b5b95;
  --shadow:0 1px 2px rgba(18,32,41,.06),0 8px 24px -12px rgba(18,32,41,.18);
  --r:16px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{font-family:Inter,system-ui,sans-serif;background:var(--paper);color:var(--text);
  font-size:15px;line-height:1.5;padding-bottom:calc(72px + env(safe-area-inset-bottom));-webkit-font-smoothing:antialiased}
h1,h2,h3,h4{font-family:'Space Grotesk',sans-serif;margin:0;letter-spacing:-.01em}
.mono{font-family:'Space Mono',monospace}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
a{color:inherit}
.wrap{max-width:900px;margin:0 auto}

/* Header */
header{position:sticky;top:0;z-index:1000;background:var(--ink);color:#eaf1f4;
  padding:calc(env(safe-area-inset-top) + 12px) 16px 12px;box-shadow:0 2px 12px rgba(0,0,0,.15)}
.hrow{display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand{font-family:'Space Grotesk';font-weight:600;font-size:15px;letter-spacing:.02em;display:flex;align-items:center;gap:8px}
.brand .dot{width:9px;height:9px;border-radius:50%;background:var(--cinnabar);box-shadow:0 0 0 3px rgba(200,68,46,.25)}
.clock{text-align:right;font-size:11px;color:#9fb2bc;line-height:1.35}
.clock b{display:block;font-family:'Space Mono';font-size:14px;color:#eaf1f4;font-weight:700}
.hmeta{display:flex;align-items:center;gap:10px;margin-top:11px}
.hmeta .city{font-family:'Space Grotesk';font-weight:600;font-size:19px;color:#fff;flex:1;min-width:0;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.daychip{font-family:'Space Mono';font-size:11px;font-weight:700;color:#cfe0e7;background:rgba(255,255,255,.09);
  padding:4px 9px;border-radius:20px;white-space:nowrap}
.prog{height:4px;background:rgba(255,255,255,.12);border-radius:4px;margin-top:11px;overflow:hidden}
.prog>i{display:block;height:100%;background:linear-gradient(90deg,var(--cinnabar),#e0764f);border-radius:4px;transition:width .4s}

/* Views */
main{padding:16px 14px 30px}
.view{display:none;animation:fade .28s ease}
.view.on{display:block}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.vhead{display:flex;align-items:baseline;justify-content:space-between;margin:2px 4px 14px}
.vhead h2{font-size:22px;font-weight:700}
.vhead .sub{font-size:12px;color:var(--muted)}

/* Cards */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
.pad{padding:16px}
.eyebrow{font-family:'Space Mono';font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}

/* Hero (Today) */
.hero{background:linear-gradient(160deg,var(--ink),var(--ink2));color:#eef4f6;border:none;overflow:hidden;position:relative}
.hero .pad{padding:18px}
.hero .date{display:flex;align-items:baseline;gap:8px}
.hero .date .dow{font-family:'Space Grotesk';font-weight:700;font-size:26px;color:#fff}
.hero .date .d{font-family:'Space Mono';font-size:13px;color:#9fb2bc}
.hero .route{font-family:'Space Grotesk';font-size:15px;color:#cfe0e7;margin:9px 0 2px;display:flex;align-items:center;gap:7px;flex-wrap:wrap}
.hero .route .arrow{color:var(--cinnabar);font-weight:700}
.hero .act{font-family:'Space Grotesk';font-weight:600;font-size:19px;color:#fff;margin-top:12px;line-height:1.25}
.hero .fct{font-size:13px;color:#b9cad2;margin-top:3px}
.hero .kath{position:absolute;top:14px;right:14px;font-size:10px;font-family:'Space Mono';background:rgba(200,68,46,.16);
  color:#f0b6a8;padding:4px 8px;border-radius:20px;border:1px solid rgba(200,68,46,.3)}

/* Status badges */
.badge{display:inline-flex;align-items:center;gap:5px;font-family:'Space Mono';font-size:10.5px;font-weight:700;
  letter-spacing:.03em;text-transform:uppercase;padding:4px 9px;border-radius:20px;white-space:nowrap}
.b-confirmed{background:#e6f2ec;color:var(--jade)}
.b-confirm{background:#fbf1dc;color:var(--amber)}
.b-travel{background:#e9f0f4;color:var(--slate)}
.b-rest{background:#eee9f2;color:var(--violet)}
.b-heavy{background:#fbe7e2;color:var(--cinnabar)}
.dotb{width:7px;height:7px;border-radius:50%;background:currentColor}

/* Segmented control */
.seg{display:flex;gap:6px;overflow-x:auto;padding:2px 2px 8px;scrollbar-width:none}
.seg::-webkit-scrollbar{display:none}
.seg button{white-space:nowrap;font-size:12.5px;font-weight:600;color:var(--muted);background:#fff;
  border:1px solid var(--line);padding:7px 13px;border-radius:20px}
.seg button.on{background:var(--ink);color:#fff;border-color:var(--ink)}

/* Day nav */
.daynav{display:flex;align-items:center;gap:8px;margin-bottom:12px}
.daynav button{width:40px;height:40px;border-radius:12px;background:#fff;border:1px solid var(--line);
  font-size:18px;color:var(--ink);display:flex;align-items:center;justify-content:center;box-shadow:var(--shadow)}
.daynav .lbl{flex:1;text-align:center;font-family:'Space Grotesk';font-weight:600;font-size:14px}
.daynav .lbl small{display:block;font-family:'Space Mono';font-size:10px;color:var(--muted);font-weight:400;letter-spacing:.05em}
.today-btn{position:fixed;right:14px;bottom:calc(80px + env(safe-area-inset-bottom));z-index:900;
  background:var(--cinnabar);color:#fff;font-family:'Space Grotesk';font-weight:600;font-size:13px;
  padding:10px 15px;border-radius:24px;box-shadow:0 6px 20px -6px rgba(200,68,46,.6);display:none;align-items:center;gap:6px}
.today-btn.show{display:flex}

/* Plan timeline (chronological steps) */
.steps{margin-top:6px}
.step{display:flex;gap:12px;padding:10px 0;position:relative}
.step:not(:last-child)::before{content:'';position:absolute;left:15px;top:34px;bottom:-10px;width:2px;background:var(--line)}
.step .ic{width:32px;height:32px;border-radius:9px;flex-shrink:0;display:flex;align-items:center;justify-content:center;
  font-size:15px;background:#eef2f4;color:var(--slate);z-index:1}
.step.tf .ic{background:#e9f0f4;color:var(--slate)}
.step.ft .ic{background:#e6f2ec;color:var(--jade)}
.step.ht .ic{background:#eee9f2;color:var(--violet)}
.step.fl .ic{background:#fbe7e2;color:var(--cinnabar)}
.step .body{flex:1;min-width:0}
.step .when{font-family:'Space Mono';font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.step .what{font-size:14px;font-weight:500;margin-top:1px}
.step .det{font-size:12.5px;color:var(--muted);margin-top:2px;white-space:pre-line}

/* Info rows */
.irow{display:flex;gap:10px;padding:11px 0;border-top:1px solid var(--line)}
.irow:first-child{border-top:none}
.irow .k{font-family:'Space Mono';font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);width:74px;flex-shrink:0;padding-top:2px}
.irow .v{flex:1;font-size:13.5px;white-space:pre-line}
.irow .v small{color:var(--muted)}

/* Action buttons */
.acts{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.act-btn{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:600;
  padding:8px 12px;border-radius:11px;border:1px solid var(--line);background:#fff}
.act-btn.pri{background:var(--ink);color:#fff;border-color:var(--ink)}
.act-btn.wa{background:#e7f5ec;color:#0a7a3f;border-color:#c6e8d3}
.act-btn.call{background:#e9f0f7;color:#1f5fa8;border-color:#cfe0f0}
.act-btn:active{transform:scale(.97)}

/* Section label */
.slab{font-family:'Space Mono';font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin:22px 4px 9px}

/* Trip rail spine */
.rail{position:relative;padding-left:8px}
.rday{position:relative;padding:0 0 14px 46px}
.rday::before{content:'';position:absolute;left:19px;top:6px;bottom:-8px;width:3px;background:var(--line)}
.rday:last-child::before{display:none}
.rday .node{position:absolute;left:9px;top:4px;width:24px;height:24px;border-radius:50%;background:#fff;
  border:3px solid var(--slate);display:flex;align-items:center;justify-content:center;
  font-family:'Space Mono';font-size:10px;font-weight:700;color:var(--ink);z-index:2}
.rday.d-ft .node{border-color:var(--jade)}
.rday.d-rest .node{border-color:var(--violet)}
.rday.d-heavy .node{border-color:var(--cinnabar)}
.rday.active .node{border-color:var(--cinnabar);box-shadow:0 0 0 4px rgba(200,68,46,.18);transform:scale(1.12)}
.rday .rcard{background:#fff;border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);overflow:hidden}
.rday.active .rcard{border-color:var(--cinnabar)}
.rsum{padding:13px 14px;display:flex;flex-direction:column;gap:6px}
.rsum .top{display:flex;align-items:center;justify-content:space-between;gap:8px}
.rsum .dl{font-family:'Space Grotesk';font-weight:600;font-size:14px}
.rsum .dl small{font-family:'Space Mono';font-weight:400;color:var(--muted);font-size:10.5px;margin-left:6px;letter-spacing:.04em}
.rsum .city{font-size:13px;color:var(--text);font-weight:500}
.rsum .rt{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px}
.rsum .fp{font-size:12.5px;color:var(--slate);display:flex;align-items:center;gap:6px;margin-top:1px}
.rsum .exp{font-family:'Space Mono';font-size:10px;color:var(--muted);letter-spacing:.05em;margin-top:2px}
.rdetail{display:none;border-top:1px solid var(--line);padding:4px 14px 14px;background:#fcfbf8}
.rday.open .rdetail{display:block}
.rday.open .rsum .exp{color:var(--cinnabar)}

/* Factory cards */
.fgrid{display:grid;gap:12px}
@media(min-width:640px){.fgrid{grid-template-columns:1fr 1fr}}
.fcard .pad{padding:15px}
.fcard .ftop{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.fcard .co{font-family:'Space Grotesk';font-weight:600;font-size:15.5px;line-height:1.25}
.fcard .meta{font-size:12px;color:var(--muted);margin-top:3px}
.fcard .prod{display:inline-block;font-size:11.5px;font-weight:600;color:var(--ink);background:#f0ede4;
  padding:3px 9px;border-radius:8px;margin-top:9px}
.fcard .who{font-size:13px;margin-top:10px;display:flex;align-items:center;gap:6px}

/* Contacts */
.clist{display:flex;flex-direction:column;gap:10px}
.crow{display:flex;align-items:center;gap:12px;padding:13px 14px}
.crow .av{width:42px;height:42px;border-radius:12px;background:var(--ink);color:#fff;flex-shrink:0;
  display:flex;align-items:center;justify-content:center;font-family:'Space Grotesk';font-weight:600;font-size:16px}
.crow .ci{flex:1;min-width:0}
.crow .ci .nm{font-weight:600;font-size:14.5px}
.crow .ci .cc{font-size:11.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.crow .cbtns{display:flex;gap:7px}
.iconbtn{width:38px;height:38px;border-radius:11px;display:flex;align-items:center;justify-content:center;
  border:1px solid var(--line);background:#fff;font-size:16px}
.iconbtn.wa{background:#e7f5ec;border-color:#c6e8d3}
.iconbtn.call{background:#e9f0f7;border-color:#cfe0f0}

/* Alerts */
.alert{display:flex;gap:11px;padding:13px 14px;border-radius:13px;border:1px solid;margin-bottom:9px;align-items:flex-start}
.alert .ai{font-size:16px;flex-shrink:0;margin-top:1px}
.alert .at{font-size:13px}
.alert .at b{display:block;font-family:'Space Grotesk';font-size:13px;margin-bottom:2px}
.al-crit{background:#fdeae5;border-color:#f3c4b8}
.al-crit .ai{color:var(--cinnabar)}
.al-confirm{background:#fbf3df;border-color:#eddcae}
.al-confirm .ai{color:var(--amber)}
.al-caution{background:#eaf1f5;border-color:#cddce5}
.al-caution .ai{color:var(--slate)}
.al-note{background:#fff;border-color:var(--line)}
.al-note .ai{color:var(--muted)}
.alert .jump{font-family:'Space Mono';font-size:10px;color:var(--muted);letter-spacing:.05em;margin-top:5px}

/* Search */
.search{width:100%;padding:12px 14px;border-radius:13px;border:1px solid var(--line);background:#fff;
  font-size:14px;font-family:inherit;margin-bottom:14px;box-shadow:var(--shadow)}
.search:focus{outline:2px solid var(--slate);outline-offset:1px}

/* Map */
#map{height:60vh;min-height:380px;border-radius:var(--r);border:1px solid var(--line);box-shadow:var(--shadow);z-index:1}
.mapnote{font-size:11.5px;color:var(--muted);text-align:center;margin-top:8px;padding:0 8px}
.leaflet-popup-content{margin:12px 14px;font-family:Inter,sans-serif}
.pop h4{font-family:'Space Grotesk';font-size:14px;margin-bottom:4px}
.pop .pm{font-size:11.5px;color:#555;margin-bottom:2px}
.pop .pb{display:inline-block;margin-top:8px;font-size:11px;font-weight:600;color:#fff;background:var(--ink);
  padding:6px 10px;border-radius:8px;text-decoration:none}
.mkr{display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;color:#fff;
  border-radius:50% 50% 50% 4px;transform:rotate(45deg);box-shadow:0 2px 6px rgba(0,0,0,.3);font-family:'Space Mono'}
.mkr span{transform:rotate(-45deg)}

/* Bottom nav */
nav{position:fixed;left:0;right:0;bottom:0;z-index:1000;background:rgba(255,255,255,.94);
  backdrop-filter:blur(12px);border-top:1px solid var(--line);
  padding:8px 6px calc(8px + env(safe-area-inset-bottom));display:flex;justify-content:space-around}
nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;color:var(--muted);font-size:10px;font-weight:600;padding:3px 0}
nav button .ni{font-size:20px;line-height:1}
nav button.on{color:var(--cinnabar)}
nav button.on .ni{transform:translateY(-1px)}

.tiny{font-size:11.5px;color:var(--muted)}
.pending{color:var(--amber);font-style:italic}
.hidden{display:none!important}
</style>
</head>

<header>
 <div class="wrap">

  </div>

 </div>

<main class="wrap">

  <section id="v-map" class="view">

    <div class="seg" id="mapViews"></div>

    <div id="map"></div>
    <p class="mapnote" id="mapNote">Numbered pins follow the trip in sequence. The dashed line is the trip route, not exact rail/road navigation — tap a pin, then “Open in Maps” for turn-by-turn.</p>
  </section>
  <section id="v-fac" class="view"></section>
  <section id="v-con" class="view"></section>
</main>

<button class="today-btn" id="todayBtn" onclick="goToday()">◉ Today</button>

<nav class="wrap">
  <button data-v="today" class="on"><span class="ni">◎</span>Today</button>
  <button data-v="trip"><span class="ni">▤</span>Trip</button>
  <button data-v="map"><span class="ni">◈</span>Map</button>
  <button data-v="fac"><span class="ni">⌂</span>Factories</button>
  <button data-v="con"><span class="ni">☏</span>Contacts</button>
</nav>

/* ============ HELPERS ============ */
const $=s=>document.querySelector(s);
const el=(t,c,h)=>{const e=document.createElement(t);if(c)e.className=c;if(h!=null)e.innerHTML=h;return e;};
const gmaps=a=>`https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(a)}`;
const gmapsLL=(ll,n)=>`https://www.google.com/maps/search/?api=1&query=${ll[0]},${ll[1]}`;
const badge=t=>{const m={confirmed:["b-confirmed","Confirmed"],confirm:["b-confirm","Confirm needed"],travel:["b-travel","Travel day"],rest:["b-rest","Rest day"],heavy:["b-heavy","Heavy day"],factory:["b-confirmed","Confirmed"]};const x=m[t]||m.travel;return `<span class="badge ${x[0]}"><span class="dotb"></span>${x[1]}</span>`;};
function toast(msg){let t=$("#toast");if(!t){t=el("div");t.id="toast";t.style.cssText="position:fixed;bottom:96px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 16px;border-radius:20px;font-size:13px;z-index:3000;box-shadow:var(--shadow);transition:opacity .3s";document.body.appendChild(t);}t.textContent=msg;t.style.opacity="1";clearTimeout(t._t);t._t=setTimeout(()=>t.style.opacity="0",1600);}
function copy(txt){navigator.clipboard?.writeText(txt).then(()=>toast("Copied")).catch(()=>toast("Copy failed"));}
const stepIcon={tf:"🚄",fl:"✈️",ft:"🏭",ht:"🛏️",rest:"☕",ml:"🍽️"};

/* Active day detection (China time) */
function chinaNow(){return new Date(new Date().toLocaleString("en-US",{timeZone:"Asia/Shanghai"}));}
function activeDayIdx(){
  const n=chinaNow();const t=n.getFullYear()+"-"+String(n.getMonth()+1).padStart(2,"0")+"-"+String(n.getDate()).padStart(2,"0");
  if(t<DAYS[0].iso)return 0;
  for(let i=0;i<DAYS.length;i++)if(DAYS[i].iso===t)return i;
  if(t>DAYS[DAYS.length-1].iso)return DAYS.length-1;
  for(let i=0;i<DAYS.length;i++)if(t<DAYS[i].iso)return i;
  return 0;
}
let selIdx=activeDayIdx();

/* ============ HEADER ============ */
function tickClock(){
  const n=chinaNow();
  $("#cnTime").textContent=n.toLocaleTimeString("en-GB",{hour:"2-digit",minute:"2-digit",timeZone:"Asia/Shanghai"});
  $("#cnDate").textContent=n.toLocaleDateString("en-US",{weekday:"short",month:"short",day:"numeric",timeZone:"Asia/Shanghai"})+" · CST";
}
function updHeader(){
  const d=DAYS[selIdx];
  $("#hCity").textContent=d.city;
  $("#hDay").textContent="Day "+d.id+" / 12";
  $("#hProg").style.width=((selIdx+1)/DAYS.length*100)+"%";
}

function contactActions(cid,pri){
  const c=CONTACTS[cid];if(!c)return"";
  let h='<div class="acts">';
  if(pri)h+=`<button class="act-btn pri" onclick="showFactoryOf('${cid}')">Factory details ›</button>`;
  if(c.wa)h+=`<a class="act-btn wa" href="https://wa.me/${c.wa}" target="_blank">WhatsApp</a>`;
  if(c.phone)h+=`<a class="act-btn call" href="tel:${c.phone.replace(/\s/g,'')}">Call</a>`;
  if(c.email)h+=`<a class="act-btn" href="mailto:${c.email}">Email</a>`;
  h+='</div>';return h;
}
function renderToday(){
  const d=DAYS[selIdx],v=$("#v-today");v.innerHTML="";
  // day nav
  const dn=el("div","daynav");
  dn.innerHTML=`<button ${selIdx===0?"disabled style=opacity:.35":""} onclick="stepDay(-1)">‹</button>
    <div class="lbl">Day ${d.id} · ${d.dow}<small>${d.date}, 2026</small></div>
    <button ${selIdx===DAYS.length-1?"disabled style=opacity:.35":""} onclick="stepDay(1)">›</button>`;
  v.appendChild(dn);
  // hero
  const hero=el("div","card hero");
  const f=d.factory?FACTORIES[d.factory]:null;
  hero.innerHTML=`<div class="pad">
    ${d.kath?'<span class="kath">Kathleen flies home today</span>':''}
    <div class="date"><span class="dow">${d.dow}</span><span class="d">${d.date} · 2026</span></div>
    <div class="route">${d.city.replace('→','<span class="arrow">→</span>')} ${d.next&&d.next!=='—'?`<span class="arrow">→</span> <span style="color:#9fb2bc">${d.next}</span>`:''}</div>

  v.appendChild(hero);
  // plan steps
  const plan=el("div","card pad");plan.style.marginTop="12px";
  plan.innerHTML='<div class="eyebrow">Plan for the day</div><div class="steps"></div>';

  d.steps.forEach(s=>{
    const st=el("div","step "+(stepCls[s[0]]||""));
    st.innerHTML=`<div class="ic">${stepIcon[s[0]]||"•"}</div><div class="body">
      <div class="when">${s[1]}</div><div class="what">${s[2]}</div>${s[3]?`<div class="det">${s[3]}</div>`:''}</div>`;
    steps.appendChild(st);
  });
  v.appendChild(plan);
  // transport
  if(d.flight||d.rail){
    const tr=el("div","card pad");tr.style.marginTop="12px";
    let h='<div class="eyebrow">Transport</div>';
    if(d.flight)h+=`<div class="irow"><div class="k">Flight</div><div class="v">${d.flight}</div></div>`;
    if(d.rail)h+=`<div class="irow"><div class="k">Rail</div><div class="v">${d.rail}</div></div>`;
    if(d.checkout)h+=`<div class="irow"><div class="k">Check out</div><div class="v">${d.checkout}</div></div>`;
    if(d.checkin)h+=`<div class="irow"><div class="k">Sleep</div><div class="v">${d.checkin}</div></div>`;
    tr.innerHTML=h;v.appendChild(tr);
  }
  // factory card
  if(f){
    const fc=el("div","card pad");fc.style.marginTop="12px";
    fc.innerHTML=`<div class="eyebrow">Factory visit</div>
      <div style="font-family:'Space Grotesk';font-weight:600;font-size:16px;margin-top:6px">${f.co}</div>
      <div class="tiny" style="margin-top:2px">${CONTACTS[f.contact].name} · ${f.city}</div>
      <div class="irow" style="margin-top:8px"><div class="k">Factory</div><div class="v">${f.loc&&LOC[f.loc]?LOC[f.loc].addr||f.city:f.city}
        <div class="acts"><button class="act-btn" onclick="copy('${(LOC[f.loc]?.addr||f.city).replace(/'/g,"\\'")}')">Copy</button><a class="act-btn" target="_blank" href="${gmaps(LOC[f.loc]?.addr||f.city)}">Open in Maps</a></div></div></div>
      <div class="irow"><div class="k">Pickup</div><div class="v">${f.car}</div></div>
      <div class="irow"><div class="k">Discuss</div><div class="v">${f.discuss}</div></div>
      ${contactActions(f.contact,true)}`;
    v.appendChild(fc);
  }
  // hotel tonight
  const ht=el("div","card pad");ht.style.marginTop="12px";
  ht.innerHTML=`<div class="eyebrow">Tonight</div><div class="irow" style="margin-top:6px"><div class="k">Hotel</div><div class="v">${f?f.hotel:(d.checkin?('Overnight — '+d.checkin):'—')}</div></div>`;
  v.appendChild(ht);
  // day alerts
  const dayAlerts=ALERTS.filter(a=>a.day===d.id);
  if(dayAlerts.length){
    v.appendChild(el("div","slab","Needs attention today"));
    dayAlerts.forEach(a=>v.appendChild(alertEl(a)));
  }
  // tomorrow
  if(selIdx<DAYS.length-1){
    const t=DAYS[selIdx+1];
    const tm=el("button","card pad");tm.style.cssText="margin-top:12px;width:100%;text-align:left;display:block";
    tm.onclick=()=>{selIdx++;renderToday();updHeader();window.scrollTo(0,0);};
    tm.innerHTML=`<div class="eyebrow">Tomorrow · ${t.date}</div>
      <div style="display:flex;justify-content:space-between;align-items:center;margin-top:6px;gap:10px">
        <div><div style="font-family:'Space Grotesk';font-weight:600;font-size:15px">${t.title}</div>
        <div class="tiny" style="margin-top:2px">${t.city}</div></div><div style="font-size:20px;color:var(--muted)">›</div></div>`;
    v.appendChild(tm);
  }
  updTodayBtn();
}
function stepDay(n){selIdx=Math.max(0,Math.min(DAYS.length-1,selIdx+n));renderToday();updHeader();window.scrollTo({top:0,behavior:"smooth"});}
function goToday(){selIdx=activeDayIdx();switchView("today");renderToday();updHeader();window.scrollTo(0,0);}
function updTodayBtn(){$("#todayBtn").classList.toggle("show",selIdx!==activeDayIdx());}

function renderTrip(){
  const v=$("#v-trip");v.innerHTML="";
  v.appendChild(el("div","vhead","<h2>Trip Timeline</h2><span class='sub'>12 days · Aug 2–13</span>"));
  const rail=el("div","rail");
  DAYS.forEach((d,i)=>{
    const f=d.factory?FACTORIES[d.factory]:null;
    const rd=el("div","rday d-"+d.type+(i===activeDayIdx()?" active":""));
    const cls={factory:"d-ft",rest:"d-rest",heavy:"d-heavy",travel:"d-tf"}[d.type]||"";
    rd.classList.add(cls);
    rd.innerHTML=`<div class="node">${d.id}</div>
      <div class="rcard">
        <div class="rsum" onclick="this.closest('.rday').classList.toggle('open')">
          <div class="top"><div class="dl">${d.dow.slice(0,3)}<small>${d.date}</small></div>${badge(f?f.status:d.type)}</div>
          <div class="city">${d.city}</div>
          <div class="rt">${f?'🏭 '+f.disp:'• '+d.title}</div>
          ${f?`<div class="fp">${f.product}</div>`:''}
          <div class="exp">tap to ${'expand ▾'}</div>
        </div>
        <div class="rdetail">${tripDetail(d,f)}</div>
      </div>`;
    rail.appendChild(rd);
  });
  v.appendChild(rail);
}
function tripDetail(d,f){
  let h="";
  const row=(k,val)=>val?`<div class="irow"><div class="k">${k}</div><div class="v">${val}</div></div>`:"";
  h+=`<div style="padding-top:10px">`;
  h+=row("Notes",d.summary);
  h+=row("Flight",d.flight);
  h+=row("Rail",d.rail);
  h+=row("Check out",d.checkout);
  h+=row("Check in",d.checkin);
  if(f){
    h+=row("Company",f.co);
    h+=row("Contact",CONTACTS[f.contact].name+" · "+CONTACTS[f.contact].role);
    h+=row("Office",f.office);
    h+=row("Factory",(LOC[f.loc]?.addr)||f.city);
    h+=row("Hotel",f.hotel);
    h+=row("Car",f.car);
    h+=row("Discuss",f.discuss);
    h+=row("Remarks",f.remarks);
    h+=`<div class="acts">
      <a class="act-btn" target="_blank" href="${gmaps((LOC[f.loc]?.addr)||f.city)}">Open in Maps</a>
      <a class="act-btn wa" target="_blank" href="https://wa.me/${CONTACTS[f.contact].wa}">WhatsApp</a>
      <a class="act-btn call" href="tel:${CONTACTS[f.contact].phone.replace(/\s/g,'')}">Call</a>
      <a class="act-btn" href="mailto:${CONTACTS[f.contact].email}">Email</a></div>`;
  } else { h+=row("Remarks", d.type==='rest'?'Rest day':''); }
  h+=`</div>`;return h;
}

/* ============ FACTORIES ============ */
let facFilter="all";
function renderFac(){
  const v=$("#v-fac");v.innerHTML="";
  v.appendChild(el("div","vhead","<h2>Factories</h2><span class='sub'>8 visits · by date</span>"));
  const inp=el("input","search");inp.placeholder="Search company, contact, product, city…";
  inp.oninput=()=>drawFac(inp.value.toLowerCase());v.appendChild(inp);
  const box=el("div","fgrid");box.id="facBox";v.appendChild(box);
  drawFac("");
}
function drawFac(q){
  const box=$("#facBox");box.innerHTML="";
  Object.entries(FACTORIES).forEach(([id,f])=>{
    const c=CONTACTS[f.contact];
    const hay=(f.co+f.disp+f.product+f.city+c.name).toLowerCase();
    if(q&&!hay.includes(q))return;
    const card=el("div","card fcard");
    card.innerHTML=`<div class="pad">
      <div class="ftop"><div><div class="co">${f.co}</div><div class="meta">${f.date} · ${f.city}</div></div>${badge(f.status)}</div>
      <div class="prod">${f.product}</div>
      <div class="who">👤 ${c.name} <span class="tiny">· ${c.role}</span></div>
      <div class="irow" style="margin-top:10px"><div class="k">Factory</div><div class="v">${(LOC[f.loc]?.addr)||f.city}</div></div>
      <div class="irow"><div class="k">Hotel</div><div class="v">${f.hotel}</div></div>
      <div class="irow"><div class="k">Pickup</div><div class="v">${f.car}</div></div>
      <div class="irow"><div class="k">Rail</div><div class="v">${f.rail}</div></div>
      ${f.remarks?`<div class="irow"><div class="k">Remarks</div><div class="v">${f.remarks}</div></div>`:''}
      <div class="acts">
        <a class="act-btn pri" target="_blank" href="${gmaps((LOC[f.loc]?.addr)||f.city)}">Directions</a>
        <a class="act-btn wa" target="_blank" href="https://wa.me/${c.wa}">WhatsApp</a>
        <a class="act-btn call" href="tel:${c.phone.replace(/\s/g,'')}">Call</a>
        <a class="act-btn" href="mailto:${c.email}">Email</a>
        <button class="act-btn" onclick="copy('${((LOC[f.loc]?.addr)||f.city).replace(/'/g,"\\'")}')">Copy address</button>
      </div></div>`;
    box.appendChild(card);
  });
  if(!box.children.length)box.innerHTML='<p class="tiny" style="padding:20px;text-align:center">No factories match that search.</p>';
}
function showFactoryOf(cid){
  const entry=Object.entries(FACTORIES).find(([id,f])=>f.contact===cid);
  switchView("fac");renderFac();
  if(entry)setTimeout(()=>{drawFac(FACTORIES[entry[0]].co.toLowerCase().split(' ')[0]);},50);
}

/* ============ CONTACTS ============ */
function renderCon(){
  const v=$("#v-con");v.innerHTML="";
  v.appendChild(el("div","vhead","<h2>Contacts</h2><span class='sub'>8 suppliers</span>"));
  const inp=el("input","search");inp.placeholder="Search contacts…";
  inp.oninput=()=>drawCon(inp.value.toLowerCase());v.appendChild(inp);
  const list=el("div","clist");list.id="conList";v.appendChild(list);
  drawCon("");
}
function drawCon(q){
  const list=$("#conList");list.innerHTML="";
  Object.entries(CONTACTS).forEach(([id,c])=>{
    if(q&&!(c.name+c.co+c.product).toLowerCase().includes(q))return;
    const row=el("div","card crow");
    const ini=c.name.split(/[ \/]/)[0][0]+(c.name.split(/[ \/]/)[1]?.[0]||"");
    row.innerHTML=`<div class="av">${ini}</div>
      <div class="ci"><div class="nm">${c.name}</div><div class="cc">${c.co}</div><div class="cc tiny">${c.product}</div></div>
      <div class="cbtns">
        <a class="iconbtn wa" target="_blank" href="https://wa.me/${c.wa}" title="WhatsApp">✆</a>
        <a class="iconbtn call" href="tel:${c.phone.replace(/\s/g,'')}" title="Call">☏</a>
        <a class="iconbtn" href="mailto:${c.email}" title="Email">✉</a>
      </div>`;
    list.appendChild(row);
  });
}

/* ============ ALERTS (shared) ============ */
function alertEl(a){
  const icon={crit:"⚠",confirm:"◑",caution:"△",note:"ℹ"}[a.sev];
  const e=el("div","alert al-"+a.sev);
  e.innerHTML=`<div class="ai">${icon}</div><div class="at"><b>${a.t}</b>${a.d}
    <div class="jump">→ Day ${a.day} · ${DAYS[a.day-1].date}</div></div>`;
  e.onclick=()=>{selIdx=a.day-1;switchView("today");renderToday();updHeader();window.scrollTo(0,0);};
  return e;
}

/* ============ MAP ============ */
let map,layers={},routeLine,mapReady=false,mapView="all",curFilter="all";
const catColor={fac:"#c8442e",rail:"#2f7d5b",air:"#5b7a8c",city:"#6b5b95",hotel:"#bf8613"};
function mkIcon(label,cat){
  return L.divIcon({className:"",html:`<div class="mkr" style="width:26px;height:26px;background:${catColor[cat]||'#333'}"><span>${label}</span></div>`,iconSize:[26,26],iconAnchor:[13,26],popupAnchor:[0,-24]});
}
function initMap(){
  if(mapReady)return;mapReady=true;
  map=L.map('map',{scrollWheelZoom:false}).setView([31.5,117],5);
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:18,attribution:'© OpenStreetMap'}).addTo(map);
  buildMarkers();
  drawRoute();
}
function buildMarkers(){
  Object.values(layers).forEach(l=>map.removeLayer(l));layers={};
  // one marker per LOC, numbered by first appearance in route order
  const seq=[];DAYS.forEach(d=>d.locs.forEach(k=>{if(!seq.includes(k))seq.push(k);}));
  const facSeq=Object.values(FACTORIES).map(f=>f.loc);
  seq.forEach((k,i)=>{
    const L0=LOC[k];if(!L0)return;
    let label=L0.t==='fac'?'🏭':(L0.t==='rail'?'🚉':(L0.t==='air'?'✈':(L0.t==='hotel'?'🛏':'●')));
    // number factories in visit order
    const fi=Object.values(FACTORIES).findIndex(f=>f.loc===k);
    if(L0.t==='fac'&&fi>=0)label=(fi+1);
    const m=L.marker(L0.ll,{icon:mkIcon(label,L0.t)});
    m.bindPopup(popupHtml(k,L0));
    m._cat=L0.t;layers[k]=m;
  });
  applyFilter();
}
function popupHtml(k,L0){
  const f=Object.entries(FACTORIES).find(([id,ff])=>ff.loc===k);
  let h=`<div class="pop"><h4>${L0.n}</h4><div class="pm">${L0.city}</div>`;
  if(f){const ff=f[1],c=CONTACTS[ff.contact];
    h+=`<div class="pm">Visit: ${ff.date} · ${c.name}</div><div class="pm">${ff.product}</div>`;
    h+=`<div class="pm" style="margin-top:4px">${badge(ff.status)}</div>`;
    h+=`<a class="pb" target="_blank" href="${gmaps(L0.addr||L0.city)}">Open in Maps</a> `;
    h+=`<a class="pb" style="background:#0a7a3f" target="_blank" href="https://wa.me/${c.wa}">WhatsApp</a>`;
  } else {
    h+=`<div class="pm">${L0.acc}</div><a class="pb" target="_blank" href="${gmapsLL(L0.ll)}">Open in Maps</a>`;
  }
  h+=`</div>`;return h;
}
function drawRoute(){
  if(routeLine)map.removeLayer(routeLine);
  const seq=[];DAYS.forEach(d=>{const main=d.locs.find(k=>LOC[k]&&(LOC[k].t==='city'||LOC[k].t==='fac'))||d.locs[0];if(main)seq.push(LOC[main].ll);});
  routeLine=L.polyline(seq,{color:"#c8442e",weight:2.5,dashArray:"6 7",opacity:.8}).addTo(map);
}
function applyFilter(){
  Object.entries(layers).forEach(([k,m])=>{
    const L0=LOC[k];let show=true;
    if(mapView==='today'){show=DAYS[selIdx].locs.includes(k);}
    else if(mapView==='fac'){show=L0.t==='fac';}
    else if(mapView==='hub'){show=(L0.t==='rail'||L0.t==='air');}
    if(show&&curFilter!=='all'){
      if(curFilter==='fac')show=L0.t==='fac';
      else if(curFilter==='rail')show=L0.t==='rail';
      else if(curFilter==='air')show=L0.t==='air';
      else if(curFilter==='hotel')show=(L0.t==='hotel'||L0.t==='city');
    }
    if(show)m.addTo(map);else map.removeLayer(m);
  });
  if(routeLine){if(mapView==='all')routeLine.addTo(map);else map.removeLayer(routeLine);}
}
function renderMapControls(){
  const views=[["all","Entire trip"],["today","Today's route"],["fac","Factories"],["hub","Transport hubs"]];
  const filts=[["all","All"],["fac","Factories"],["rail","Railway"],["air","Airports"],["hotel","Cities/Hotels"]];
  $("#mapViews").innerHTML=views.map(v=>`<button class="${v[0]===mapView?'on':''}" data-mv="${v[0]}">${v[1]}</button>`).join("");
  $("#mapFilters").innerHTML=filts.map(v=>`<button class="${v[0]===curFilter?'on':''}" data-mf="${v[0]}">${v[1]}</button>`).join("");
  $("#mapViews").querySelectorAll("button").forEach(b=>b.onclick=()=>{mapView=b.dataset.mv;renderMapControls();applyFilter();if(mapView==='today'&&LOC[DAYS[selIdx].locs[0]])map.setView(LOC[DAYS[selIdx].locs[0]].ll,7);else map.setView([31.5,117],5);});
  $("#mapFilters").querySelectorAll("button").forEach(b=>b.onclick=()=>{curFilter=b.dataset.mf;renderMapControls();applyFilter();});
}

/* ============ NAV ============ */
function switchView(name){
  document.querySelectorAll(".view").forEach(v=>v.classList.remove("on"));
  $("#v-"+name).classList.add("on");
  document.querySelectorAll("nav button").forEach(b=>b.classList.toggle("on",b.dataset.v===name));
  if(name==="map"){setTimeout(()=>{initMap();renderMapControls();map.invalidateSize();applyFilter();},60);}
  window.scrollTo(0,0);
}
document.querySelectorAll("nav button").forEach(b=>b.onclick=()=>{
  const n=b.dataset.v;switchView(n);
  if(n==="trip")renderTrip();if(n==="fac")renderFac();if(n==="con")renderCon();if(n==="today"){renderToday();}
});

/* ============ INIT ============ */
tickClock();setInterval(tickClock,1000*20);
updHeader();renderToday();
window.addEventListener("scroll",updTodayBtn);
</script>
